server:
  host: "0.0.0.0"
  port: 8080
  # Origin the OAuth redirect URIs are built from. Leave it out and each flow
  # derives it from the request that started it — the address you reached
  # FreeReps on — so a fresh installation needs nothing here. Set it behind a
  # reverse proxy under a different name, or where the UI answers on several
  # names while the provider accepts one registered URI. Scheme and host only.
  # base_url: "https://freereps.example.ts.net"

database:
  host: "localhost"
  port: 5432
  name: "freereps"
  user: "freereps"
  password: "freereps"
  sslmode: "disable"

tailscale:
  enabled: false       # set to true (default) for production/Docker
  hostname: "freereps"
  state_dir: "tsnet-state"

ingest:
  # The zone the Alpha Progression CSV's session times are read in. The export
  # carries a bare wall clock with no zone, and the resulting instant is part of
  # a workout_sets row's natural key, so this value must be the same on every
  # host that imports — reading one export in two zones stores every session
  # twice. Startup fails on an unknown zone, on "" and on "Local".
  session_timezone: "Europe/Berlin"

oura:
  sync_interval: "30m"   # how often to poll Oura API (per-user creds configured in Settings UI)
  backfill_days: 90      # days of history to fetch on first sync

hevy:
  sync_interval: "30m"   # how often to poll the Hevy event feed (API key configured in Settings UI)

withings:
  sync_interval: "30m"   # how often to poll Withings (per-user creds configured in Settings UI)
  backfill_days: 90      # days of history to fetch on first sync

# Machine-readable alerts: a JSON POST to an ntfy topic in Uptime Kuma's webhook
# shape, one monitor id per condition. See the Alerts section of README.md.
#
# These values seed the `alert_settings` row on first start only. After that the
# Settings screen (Settings -> Alerts) owns them and this block is ignored, so a
# redeploy cannot overwrite what was entered there.
alerts:
  enabled: false
  ntfy_url: "https://ntfy.example.com/freereps-alerts"
  hostname: "freereps"
  check_interval: "5m"
  failure_threshold: 3   # consecutive failed runs of one source for one user
  apple_silence: "36h"   # no Health Auto Export delivery for this long

# Which source wins when two of them cover the same measurement. Named entries
# match by prefix; "" is the empty source Health Auto Export writes.
source_priority:
  - "Withings"
  - "Oura"
  - ""
