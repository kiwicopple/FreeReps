name: Web parity
on:
  push:
    branches: [main]
    paths: ['server/web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['server/web/**', '.github/workflows/web.yml']
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
